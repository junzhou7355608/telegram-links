name: telegram-links

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telegram_links
      POSTGRES_PASSWORD: telegram_links
      POSTGRES_USER: telegram_links
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U telegram_links -d telegram_links']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
